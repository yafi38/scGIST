[project]
name = "scgist"
dynamic = ["version"]
description = "Gene panel design for spatial transcriptomics with prioritized gene sets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Mashrur Ahmed Yafi", email = "yafi2475@gmail.com" },
    { name = "Md. Hasibul Husain Hisham" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "anndata>=0.10",
    "scikit-learn>=1.4",
    "tensorflow>=2.16",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandas>=2.2",
]

[project.urls]
Homepage = "https://github.com/yafi38/scGIST"

[dependency-groups]
# Only needed to reproduce benchmarks/create_panels.py; never shipped in the
# published package.
benchmarks = [
    "scanpy>=1.10",
    "tqdm>=4.70",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/scgist"]
